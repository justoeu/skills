<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #ecebe7; font-family: "Space Grotesk", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #1d2430; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  pre { margin: 0; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #cfcdc7; border-radius: 6px; }
  a { color: #2b8a92; text-decoration: none; }
  a:hover { color: #1b6a71; text-decoration: underline; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 246px minmax(0,1fr); min-height: 100vh; background: #ecebe7; }
  .shell.nav-closed { grid-template-columns: 62px minmax(0,1fr); }
  .side { background:#161f2e; color:#cfd6e2; padding:18px 12px 26px; display:flex; flex-direction:column; gap:20px; position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto; }
  .main { min-width:0; display:flex; flex-direction:column; }
  .hd { background:#f6f5f2; border-bottom:1px solid #dcdad3; padding:16px 26px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; }
  .hd .crumb { font-family:"JetBrains Mono",monospace; font-size:11px; color:#8a857d; }
  .hd .title { font-size:19px; font-weight:600; letter-spacing:-0.015em; margin-top:3px; }
  .hd-chips { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .chip { background:#fff; border:1px solid #dcdad3; border-radius:8px; padding:7px 11px; font-size:12px; color:#5d6470; display:flex; align-items:center; gap:7px; }
  .chip.btn { cursor:pointer; color:#2b6a70; }
  .chip.btn:hover { border-color:#2b8a92; }
  .cols { display:grid; gap:18px; padding:18px 26px 40px; align-items:start; }
  .cols.panel-on { grid-template-columns: minmax(0,1.8fr) minmax(300px,0.95fr); }
  .cols.panel-off { grid-template-columns: minmax(0,1fr) 46px; }
  .cols.panel-none { grid-template-columns: minmax(0,1fr); }
  .col-main { min-width:0; display:flex; flex-direction:column; gap:18px; }
  .col-insp { min-width:0; display:flex; flex-direction:column; gap:18px; position:sticky; top:92px; }

  /* ---------- sidebar ---------- */
  .s-top { display:flex; gap:10px; align-items:center; justify-content:space-between; }
  .s-logo { display:flex; gap:10px; align-items:center; min-width:0; }
  .s-mark { width:32px; height:32px; flex:0 0 32px; border-radius:9px; background:#2b8a92; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:#07171a; }
  .s-name { font-size:14px; font-weight:600; color:#fff; letter-spacing:-.01em; }
  .s-ver { font-size:10.5px; color:#7c8798; font-family:"JetBrains Mono",monospace; }
  .s-btn { width:24px; height:24px; flex:0 0 24px; border:1px solid #33405c; border-radius:7px; display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-size:11px; color:#8fd6da; cursor:pointer; background:none; padding:0; }
  .s-btn:hover { border-color:#2b8a92; }
  .s-btn.wide { width:38px; height:28px; flex-basis:38px; }
  .s-label { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#6b7689; padding-left:9px; margin-bottom:7px; }
  .s-app { background:#22304a; border-radius:9px; padding:11px 12px; }
  .s-app-hd { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .s-app-name { font-size:13.5px; font-weight:600; color:#fff; }
  .s-app-score { font-family:"JetBrains Mono",monospace; font-size:10px; color:#8fd6da; }
  .s-app-meta { font-family:"JetBrains Mono",monospace; font-size:10px; color:#93a0b4; line-height:1.7; margin-top:6px; }
  .nav-sec { display:flex; flex-direction:column; gap:2px; }
  .nav-row { position:relative; padding:8px 10px; border-radius:8px; font-size:13px; color:#cfd6e2; cursor:pointer; display:flex; align-items:center; gap:10px; background:none; border:none; text-align:left; width:100%; font-family:inherit; }
  .nav-row:hover { background:#1d2739; color:#fff; }
  .nav-row .ic { font-family:"JetBrains Mono",monospace; font-size:13px; width:18px; text-align:center; color:#aeb9c9; flex:0 0 18px; }
  .nav-row.sel .ic { color:#8fd6da; }
  .nav-row .lb { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-row .bar { position:absolute; left:0; top:5px; bottom:5px; width:2px; background:#2b8a92; border-radius:2px; }
  .nav-flow { position:relative; padding:6px 11px 6px 26px; border-radius:8px; font-size:12px; color:#8792a5; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px; background:none; border:none; text-align:left; width:100%; font-family:inherit; }
  .nav-flow:hover { background:#1d2739; color:#fff; }
  .nav-flow .lb { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-flow .cov { font-family:"JetBrains Mono",monospace; font-size:9.5px; flex:0 0 auto; }
  .nav-flow .bar { position:absolute; left:14px; top:7px; bottom:7px; width:2px; background:#2b8a92; border-radius:2px; }
  .s-foot { margin-top:auto; border-top:1px solid #26314a; padding-top:16px; font-family:"JetBrains Mono",monospace; font-size:10px; line-height:1.7; color:#7c8798; }
  .s-foot .hl { color:#8fd6da; }
  .hide { display:none !important; }

  /* ---------- cards & primitives ---------- */
  .card { background:#fff; border:1px solid #dcdad3; border-radius:12px; padding:18px; }
  .card.flush { padding:0; overflow:hidden; }
  .card-hd { padding:15px 18px 0; }
  .card-title { font-size:15px; font-weight:600; }
  .card-sub { font-size:12px; color:#8a857d; margin-top:2px; }
  .kv-label { font-family:"JetBrains Mono",monospace; font-size:10px; color:#8a857d; text-transform:uppercase; letter-spacing:.1em; }
  .kv-label.tight { margin-bottom:6px; }
  .tag { font-family:"JetBrains Mono",monospace; font-size:10px; border-radius:5px; padding:2px 6px; border:1px solid; height:fit-content; white-space:nowrap; }
  .tag.red   { color:#b4453a; border-color:#e6cdc9; background:#faf3f2; }
  .tag.amber { color:#c08a2e; border-color:#ecdcc0; background:#fbf7ef; }
  .tag.green { color:#3f7a4f; border-color:#cfe0d2; background:#f2f7f3; }
  .tag.gray  { color:#5d6470; border-color:#dcdad3; background:#f6f5f2; }
  .tag.teal  { color:#2b6a70; border-color:#cfe3e4; background:#f0f7f7; }
  .code-tag { font-family:"JetBrains Mono",monospace; font-size:9px; color:#2b6a70; }
  .ext-tag  { font-family:"JetBrains Mono",monospace; font-size:9px; color:#8a857d; }
  .pill { font-family:"JetBrains Mono",monospace; font-size:10.5px; color:#2b6a70; border:1px solid #cfe3e4; background:#f0f7f7; border-radius:5px; padding:3px 7px; display:inline-block; }
  .pill.gray { color:#5d6470; border-color:#dcdad3; background:#fff; }
  .pill.dashed { color:#a8a39a; border-style:dashed; background:transparent; }
  .pre-dark { background:#161f2e; color:#d7e0ee; border-radius:8px; padding:12px; font-family:"JetBrains Mono",monospace; font-size:11px; line-height:1.65; overflow-x:auto; white-space:pre; }
  .pre-light { background:#f6f5f2; border:1px solid #e4e2db; color:#2b3342; border-radius:8px; padding:12px; font-family:"JetBrains Mono",monospace; font-size:11px; line-height:1.65; overflow-x:auto; white-space:pre; }
  .grid-auto { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .grid-auto.wide { grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); }
  .stat { background:#f6f5f2; border:1px solid #e4e2db; border-radius:9px; padding:10px 11px; }
  .stat.dashed { background:#fff; border-style:dashed; border-color:#cfcdc7; }
  .stat .k { font-family:"JetBrains Mono",monospace; font-size:10px; color:#8a857d; display:flex; justify-content:space-between; gap:6px; }
  .stat .v { font-size:15px; font-weight:600; margin-top:3px; }
  .stat .v.muted { color:#a8a39a; }
  .stat .sub { font-size:11.5px; color:#8a857d; margin-top:1px; }
  .rowline { display:flex; flex-direction:column; gap:0; }
  .rowitem { display:grid; gap:12px; align-items:start; border-bottom:1px solid #f0efea; padding:9px 8px; }
  .rowitem:hover { background:#f6f5f2; }
  .tbl { display:grid; gap:10px; align-items:center; padding:8px; border-bottom:1px solid #f4f3ef; font-size:12px; }
  .tbl:hover { background:#f6f5f2; }
  .tbl-hd { font-family:"JetBrains Mono",monospace; font-size:10px; color:#8a857d; padding:0 8px 7px; border-bottom:1px solid #e9e7e0; }
  .scroll-x { overflow-x:auto; }

  /* ---------- diagram ---------- */
  .dg-wrap { padding:14px; overflow-x:auto; }
  .dg-box { position:relative; background:#f6f5f2; border:1px solid #e4e2db; border-radius:10px; background-image:radial-gradient(#dedcd4 1px, transparent 1px); background-size:22px 22px; }
  .dg-node { position:absolute; border-radius:10px; padding:11px 13px; cursor:pointer; color:#fff; }
  .dg-node .nm { font-size:13px; font-weight:600; }
  .dg-node .sb { font-family:"JetBrains Mono",monospace; font-size:10px; margin-top:3px; }
  .dg-node.own  { background:#222c3d; }
  .dg-node.own:hover { background:#2d3a50; }
  .dg-node.internal { background:#fff; border:1px solid #cfcdc7; color:#1d2430; }
  .dg-node.internal .sb { color:#8a857d; }
  .dg-node.internal:hover { border-color:#2b8a92; }
  .dg-node.store { background:#1b3b3e; }
  .dg-node.store .sb { color:#9ec9cc; }
  .dg-node.store:hover { background:#265054; }
  .dg-node.client { background:#222c3d; }
  .dg-node.client:hover { background:#2d3a50; }
  .dg-node .ring { position:absolute; inset:-4px; border:2px solid #2b8a92; border-radius:13px; pointer-events:none; }
  .dg-legend { position:absolute; left:20px; bottom:16px; display:flex; gap:14px; font-family:"JetBrains Mono",monospace; font-size:10px; color:#8a857d; }
  .dg-svg { position:absolute; inset:0; overflow:visible; pointer-events:none; }

  /* ---------- chain steps ---------- */
  .chain { position:relative; display:flex; align-items:center; min-width:900px; background:#f6f5f2; border:1px solid #e4e2db; border-radius:10px; background-image:radial-gradient(#dedcd4 1px, transparent 1px); background-size:22px 22px; padding:34px 22px 40px; }
  .chain-cell { display:flex; align-items:center; flex:1 1 0; min-width:0; }
  .chain-node { position:relative; flex:1 1 0; min-width:0; border-radius:10px; background:#222c3d; color:#fff; padding:12px 13px; cursor:pointer; }
  .chain-node:hover { opacity:.92; }
  .chain-node.sel { background:#2b8a92; }
  .chain-node .n { font-family:"JetBrains Mono",monospace; font-size:9.5px; color:#93a0b4; }
  .chain-node.sel .n { color:#d8f0f1; }
  .chain-node .t { font-size:12.5px; font-weight:600; margin-top:3px; line-height:1.3; }
  .chain-node .tech { font-family:"JetBrains Mono",monospace; font-size:10px; color:#93a0b4; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chain-node.sel .tech { color:#d8f0f1; }
  .chain-arrow { width:76px; flex:0 0 76px; position:relative; height:40px; display:flex; align-items:center; justify-content:center; }
  .chain-arrow .ln { position:absolute; left:8px; right:8px; top:19px; height:1.6px; background:#7cb8bd; }
  .chain-arrow .ar { position:absolute; right:6px; top:14px; width:0; height:0; border-left:7px solid #7cb8bd; border-top:5px solid transparent; border-bottom:5px solid transparent; }
  .chain-arrow .el { position:absolute; top:-2px; left:0; right:0; text-align:center; font-family:"JetBrains Mono",monospace; font-size:9.5px; color:#6f8f93; }

  /* ---------- accordions ---------- */
  .acc { border:1px solid #e4e2db; border-radius:10px; overflow:hidden; }
  .acc.sel { border-color:#2b8a92; }
  .acc-hd { padding:11px 13px; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; cursor:pointer; }
  .acc-hd:hover { background:#f6f5f2; }
  .caret { width:22px; height:22px; border:1px solid #dcdad3; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-size:11px; color:#5d6470; flex:0 0 22px; }
  .acc-body { border-top:none; background:#fbfbfa; margin:0 10px; padding:0 6px 6px; border-radius:0 0 10px 10px; display:flex; flex-direction:column; gap:14px; }
  .acc-inner { border:1px solid #cfe3e4; border-top:none; border-radius:0 0 10px 10px; background:#fbfbfa; margin:0 10px; padding:14px 16px 16px; display:flex; flex-direction:column; gap:14px; }
  .callbox { border:1px solid #e4e2db; background:#fff; border-radius:8px; padding:9px 10px; }
  .callbox .sig { font-family:"JetBrains Mono",monospace; font-size:11px; color:#2b3342; overflow-x:auto; white-space:pre; }
  .callbox .meta { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:4px; }
  .callbox .f { font-family:"JetBrains Mono",monospace; font-size:10px; color:#2b6a70; }
  .callbox .w { font-size:11.5px; color:#5d6470; }

  /* ---------- inspector ---------- */
  .insp-hd { padding:15px 16px 12px; border-bottom:1px solid #e9e7e0; }
  .insp-tabs { display:flex; gap:2px; padding:10px 12px 0; border-bottom:1px solid #e9e7e0; flex-wrap:wrap; }
  .insp-tab { font-size:12px; padding:7px 10px; border-radius:6px 6px 0 0; cursor:pointer; color:#5d6470; background:none; border:none; font-family:inherit; }
  .insp-tab:hover { background:#f6f5f2; }
  .insp-tab.sel { background:#f6f5f2; font-weight:600; color:#1d2430; }
  .insp-tab-hint { align-self:stretch; margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:#a8a39a; padding:9px 4px; }
  .insp-body { padding:14px 16px 18px; display:flex; flex-direction:column; gap:12px; }
  .dark-card { background:#161f2e; color:#cfd6e2; border-radius:12px; padding:16px; }
  .dark-card .t { font-size:14px; font-weight:600; color:#fff; }
  .dark-row { display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid #26314a; padding:7px 0; font-size:12.5px; line-height:1.5; }
  .dark-row:last-child { border-bottom:none; }
  .dark-row .k { color:#8792a5; }
  .dark-row .v-risk { color:#e8a79c; }
  .panel-open-strip { position:sticky; top:92px; background:#fff; border:1px solid #dcdad3; border-radius:12px; padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:14px; cursor:pointer; }
  .panel-open-strip:hover { border-color:#2b8a92; }
  .panel-open-strip .vt { writing-mode:vertical-rl; font-size:11.5px; letter-spacing:.06em; color:#5d6470; }

  /* ---------- score ---------- */
  .score-hero { display:flex; flex-wrap:wrap; gap:22px; align-items:center; }
  .score-big { font-size:52px; font-weight:700; letter-spacing:-.03em; line-height:1; }
  .score-grade { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; font-weight:700; font-size:16px; color:#fff; }
  .bars { display:flex; align-items:flex-end; gap:10px; height:150px; padding-bottom:6px; border-bottom:1px solid #e9e7e0; }
  .bar-cell { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; height:100%; }
  .bar-cell .bv { font-family:"JetBrains Mono",monospace; font-size:10px; color:#5d6470; }
  .bar-cell .bar { width:100%; border-radius:5px 5px 0 0; background:#cfcdc7; }
  .bars-x { display:flex; gap:10px; margin-top:7px; }
  .bars-x .bx { flex:1; text-align:center; font-family:"JetBrains Mono",monospace; font-size:9.5px; color:#a8a39a; }

  .env-search { width:100%; max-width:440px; background:#fff; border:1px solid #dcdad3; border-radius:8px; padding:8px 12px; font-size:12.5px; font-family:"JetBrains Mono",monospace; color:#1d2430; }
  .env-search:focus { outline:none; border-color:#2b8a92; }
  .env-name { font-family:"JetBrains Mono",monospace; font-size:11.5px; font-weight:600; word-break:break-all; }
  .env-val { font-family:"JetBrains Mono",monospace; font-size:10px; color:#a8a39a; margin-top:2px; word-break:break-all; }

  .foot-note { font-family:"JetBrains Mono",monospace; font-size:10px; color:#a8a39a; }
  .note-src { font-family:"JetBrains Mono",monospace; font-size:10.5px; color:#a8a39a; margin-top:5px; }
  .legend-pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; font-family:"JetBrains Mono",monospace; font-size:10px; color:#5d6470; }

  /* ---------- flow brief (card do topo) ---------- */
  .brief-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  @media (max-width: 820px) { .brief-grid { grid-template-columns:1fr; } }
  .brief-grid.one { grid-template-columns:1fr; }
  .brief-pane { border:1px solid #e4e2db; border-radius:10px; padding:12px 13px; background:#fbfbfa; min-width:0; }
  .brief-pane.happy { border-color:#cfe0d2; background:#f7fbf8; }
  .brief-pane.unhappy { border-color:#e6cdc9; background:#fbf7f6; }
  .brief-pane.fallback { border-color:#cfe3e4; background:#f3f8f8; }
  .brief-pane .ph { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .brief-body { font-size:13px; color:#2b3342; line-height:1.6; }
  .path-row { padding:8px 0; border-bottom:1px solid #efece6; }
  .path-row:last-child { border-bottom:none; padding-bottom:0; }
  .path-row:first-child { padding-top:0; }
  .path-when { font-size:12.5px; font-weight:500; line-height:1.4; }
  .path-then { font-size:12px; color:#5d6470; line-height:1.55; margin-top:3px; }
</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:monospace">Atlas Docs precisa de JavaScript. O dado bruto está em app-model.json ao lado deste arquivo.</p></noscript>
<div id="app"></div>
<script id="atlas-data" type="application/json">@@ATLAS_DATA@@</script>
<script>
"use strict";
/* Atlas Docs — dashboard data-driven. Nada aqui deve ser editado por handoff:
   todo conteúdo vem do app-model.json injetado no island acima. */
(function () {
  var MODEL = null;
  try { MODEL = JSON.parse(document.getElementById("atlas-data").textContent); }
  catch (e) { document.getElementById("app").innerHTML = '<p style="padding:24px;font-family:monospace;color:#b4453a">Falha ao ler app-model.json: ' + e.message + "</p>"; return; }
  if (!MODEL || !MODEL.app) {
    document.getElementById("app").innerHTML = '<p style="padding:24px;font-family:monospace;color:#b4453a">Modelo ausente. Rode atlas_build.py com um app-model.json válido.</p>';
    return;
  }

  /* ---------------- state ---------------- */
  var S = { screen: "know", flow: null, node: null, step: 0, stepOpen: true, tab: "payload", panel: true, nav: true, view: "seq", acc: {}, envQ: "" };
  var flows = MODEL.flows || [];
  var richFlow = flows.filter(function (f) { return f.diagram && f.diagram.nodes && f.diagram.nodes.length; })[0] || null;
  var chainFlows = flows.filter(function (f) { return f !== richFlow; });
  if (richFlow && !S.flow) S.flow = richFlow.id;

  /* ---------------- helpers ---------------- */
  function E(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function num(x, d) { x = parseInt(x, 10); return isNaN(x) ? d : x; }
  function covColor(c) { c = num(c, 0); return c >= 85 ? "#8fd6da" : c >= 75 ? "#c9b98a" : "#c96b5e"; }
  function covBarColor(c) { c = num(c, 0); return c >= 85 ? "#2b8a92" : c >= 75 ? "#68aeb3" : c >= 60 ? "#a9cfd2" : "#cfcdc7"; }
  function sevTag(sev) {
    var s = String(sev || "").toUpperCase();
    if (s.indexOf("CRÍT") === 0 || s.indexOf("CRIT") === 0 || s === "FALHA" || s === "FAIL") return "red";
    if (s === "ALTO" || s === "WARN" || s === "ATENÇÃO" || s === "BREAK") return "amber";
    if (s === "MÉDIO" || s === "MEDIO" || s === "NOTA" || s === "INFO") return "teal";
    if (s === "OK" || s === "PASS" || s === "NOVO" || s === "ADITIVO") return "green";
    return "gray";
  }
  function stateTag(st) {
    var s = String(st || "").toLowerCase();
    if (s === "breaking" || s === "bad" || s === "fail") return "red";
    if (s === "deprecado" || s === "warn") return "amber";
    if (s === "estavel" || s === "ok" || s === "pass") return "green";
    return "teal";
  }

  function diagramNodes(d) {
    var nodes = d.nodes.map(function (n) { return Object.assign({ w: 170, h: 66 }, n); });
    var hasXY = nodes.every(function (n) { return typeof n.x === "number" && typeof n.y === "number"; });
    if (!hasXY) autoLayout(nodes, d.edges || []);
    return nodes;
  }
  function autoLayout(nodes, edges) {
    var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });
    var indeg = {}; nodes.forEach(function (n) { indeg[n.id] = 0; });
    edges.forEach(function (e) { if (indeg[e.to] != null) indeg[e.to]++; });
    var depth = {}; nodes.forEach(function (n) { depth[n.id] = indeg[n.id] === 0 ? 0 : null; });
    for (var it = 0; it < nodes.length; it++) {
      edges.forEach(function (e) {
        if (depth[e.from] != null && depth[e.to] != null && depth[e.to] < depth[e.from] + 1) depth[e.to] = depth[e.from] + 1;
        if (depth[e.from] != null && depth[e.to] == null) depth[e.to] = depth[e.from] + 1;
      });
    }
    var cols = {};
    nodes.forEach(function (n) {
      var c = depth[n.id] == null ? 0 : depth[n.id];
      cols[c] = cols[c] || []; cols[c].push(n);
    });
    var maxCol = 0, maxRows = 1;
    Object.keys(cols).forEach(function (c) {
      var ci = parseInt(c, 10); maxCol = Math.max(maxCol, ci); maxRows = Math.max(maxRows, cols[c].length);
      cols[c].forEach(function (n, r) { n.x = 20 + ci * 246; n.y = 40 + r * 100; });
    });
    return { w: 20 + (maxCol + 1) * 246, h: 60 + maxRows * 100 };
  }
  function diagramSvg(d) {
    var nodes = diagramNodes(d);
    var w = d.width, h = d.height;
    if (typeof w !== "number" || typeof h !== "number") {
      var mx = 0, my = 0;
      nodes.forEach(function (n) { mx = Math.max(mx, n.x + n.w); my = Math.max(my, n.y + n.h); });
      w = mx + 20; h = my + 50;
    }
    var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });
    var sel = S.node && byId[S.node] ? S.node : null;
    var html = '<div class="dg-box" style="width:' + w + "px;height:" + h + 'px">';
    html += '<svg class="dg-svg" viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '"><defs>' +
      '<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7cb8bd"></path></marker></defs>';
    arr(d.edges).forEach(function (e) {
      var a = byId[e.from], b = byId[e.to];
      if (!a || !b) return;
      var d1 = e.path || edgePath(a, b);
      html += '<path d="' + d1 + '" fill="none" stroke="#7cb8bd" stroke-width="1.6" marker-end="url(#ar)"></path>';
      var m = pathMid(d1);
      if (e.label) html += '<text x="' + (m.x + 6) + '" y="' + (m.y - 4) + '" font-family="JetBrains Mono, monospace" font-size="10" fill="#6f8f93">' + E(e.label) + "</text>";
    });
    html += "</svg>";
    nodes.forEach(function (n) {
      html += '<div class="dg-node ' + (n.kind || "own") + '" style="left:' + n.x + "px;top:" + n.y + "px;width:" + n.w + "px;min-height:" + n.h + 'px" onclick="A.selNode(\'' + E(n.id) + '\')">';

  function edgePath(a, b) {

    if (b.y > a.y) return "M " + (a.x + a.w / 2) + " " + (a.y + a.h) + " L " + (b.x + b.w / 2) + " " + b.y;

  function pathMid(d) {

    if (!pairs.length) return { x: 0, y: 0 };
    var a = pairs[0], b = pairs[pairs.length - 1];
    return { x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2 };
  }

  function pathItems(list) {

  function flowBriefCard(f) {
    if (!f) return "";
    var b = (f.brief && typeof f.brief === "object") ? f.brief : {};
    var what = b.what || f.resumo || "";

    var happy = pathItems(b.happy);

    var html = '<section class="card" data-atlas="flow-brief">';

    if (unhappy.length) chips.push(unhappy.length + (unhappy.length === 1 ? " não feliz" : " não felizes"));

    html += "</div>";

        html += '<div class="stat"><div class="k"><span>' + E(st.k) + '</span></div><div class="v" style="font-size:14px">' + E(st.v) + "</div></div>";
      });
      html += "</div>";

      html += "</div>";
    }
    html += "</section>";
    return html;
  }

  /* ----- variáveis de ambiente ----- */
  function envVars() { return arr((MODEL.env || {}).vars); }
  function envIsSecret(v) {
    return !!v.secret || /key|secret|token|passwd|password|credential|private/i.test(String(v.name || ""));
  }
  function envUndeclared(v) { return arr(v.used).length > 0 && arr(v.sources).length === 0; }
  function envMatches(v) {
    var q = (S.envQ || "").trim().toLowerCase();
    if (!q) return true;
    return [v.name, v.desc, arr(v.flows).join(" "), arr(v.used).join(" "), arr(v.sources).join(" ")].join(" ").toLowerCase().indexOf(q) !== -1;
  }
  function envList() {
    var vars = envVars();
    var shown = vars.filter(envMatches);
    var html = '<div class="scroll-x"><div style="min-width:720px">';
    html += '<div class="tbl-hd" style="display:grid;grid-template-columns:minmax(180px,auto) minmax(0,1fr) 128px minmax(130px,auto)"><div>VARIÁVEL</div><div>O QUE É · ONDE ENTRA</div><div>CONDIÇÃO</div><div style="text-align:right">DECLARADA EM</div></div>';
    if (!shown.length) {
      html += '<div style="padding:14px 8px;font-size:12.5px;color:#8a857d">nenhuma variável corresponde ao filtro</div>';
    }
    shown.forEach(function (v) {
      var secret = envIsSecret(v);
      var undecl = envUndeclared(v);
      html += '<div class="tbl" style="grid-template-columns:minmax(180px,auto) minmax(0,1fr) 128px minmax(130px,auto);align-items:start">';
      html += '<div><div class="env-name">' + E(v.name) + "</div>";
      if (v.value) html += '<div class="env-val">' + E(secret ? "****" : v.value) + "</div>";
      else if (v.default) html += '<div class="env-val">default: ' + E(secret ? "****" : v.default) + "</div>";
      html += "</div>";
      html += '<div style="min-width:0">';
      if (v.desc) html += '<div style="font-size:12.5px;color:#2b3342;line-height:1.55">' + E(v.desc) + "</div>";
      if (arr(v.flows).length) {
        html += '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:5px">';
        arr(v.flows).forEach(function (fid) {
          var f = flowById(fid);
          html += '<button class="pill" style="cursor:pointer" onclick="A.flow(\'' + E(fid) + '\')" title="abrir fluxo">' + E(f && f.label ? f.label : fid) + "</button>";
        });
        html += "</div>";
      }
      if (arr(v.used).length) html += '<div class="mono" style="font-size:10px;color:#2b6a70;margin-top:5px;word-break:break-all">' + E(arr(v.used).join(" · ")) + "</div>";
      if (v.scope && v.scope !== "todos") html += '<div class="mono" style="font-size:10px;color:#a8a39a;margin-top:3px">escopo: ' + E(v.scope) + "</div>";
      html += "</div>";
      html += '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">';
      if (secret) html += '<span class="tag red">SEGREDO</span>';
      if (undecl) html += '<span class="tag red" style="border-style:dashed">NÃO DECLARADA</span>';
      if (v.required === true) html += '<span class="tag teal">OBRIGATÓRIA</span>';
      else if (v.required === false) html += '<span class="tag gray">OPCIONAL</span>';
      html += "</div>";
      html += '<div class="mono" style="font-size:10px;color:#8a857d;text-align:right;word-break:break-all;white-space:pre-line">' + (arr(v.sources).length ? E(arr(v.sources).join("\n")) : "—") + "</div>";
      html += "</div>";
    });
    html += "</div></div>";
    if (S.envQ) html += '<div class="foot-note" style="margin-top:7px">' + shown.length + " de " + vars.length + ' variáveis</div>';
    return html;
  }
  function rEnv() {
    var e = MODEL.env || {};
    var vars = envVars();
    var secrets = vars.filter(envIsSecret).length;
    var undecl = vars.filter(envUndeclared).length;
    var required = vars.filter(function (v) { return v.required === true; }).length;
    if (!vars.length) {
      return '<section class="card" style="border-style:dashed"><div class="card-title">Variáveis de ambiente</div><div class="card-sub">Nenhuma variável detectada no scan — cheque .env.example, docker-compose e leituras de ambiente no código.</div></section>';
    }
    var html = '<section class="card">';
    html += '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between"><div><div class="card-title">Variáveis de ambiente — o que a app espera, onde entra</div>';
    html += '<div class="card-sub">' + (arr(e.sources).length ? "fontes: " + E(arr(e.sources).join(" · ")) : "lidas do código e dos manifests") + "</div></div>";

    html += '<div class="stat"><div class="k"><span>SEGREDOs</span></div><div class="v">' + secrets + "</div></div>";
    html += '<div class="stat"><div class="k"><span>OBRIGATÓRIAs</span></div><div class="v">' + required + "</div></div>";
    html += '<div class="stat' + (undecl ? " dashed" : "") + '"><div class="k"><span>NÃO DECLARADAs</span></div><div class="v' + (undecl ? "" : " muted") + '">' + undecl + "</div></div>";
    html += "</div>";
    html += '<div style="margin-top:14px"><input class="env-search" placeholder="filtrar por nome, descrição, fluxo ou arquivo…" value="' + E(S.envQ) + '" oninput="A.envQ(this.value)"></div>';
    html += '<div id="env-list" style="margin-top:10px">' + envList() + "</div>";
    if (undecl) html += '<div class="legend-pills"><span class="pill dashed">NÃO DECLARADA = lida no código e ausente de todo .env/compose — drift que o deploy sente</span></div>';
    html += "</section>";
    return html;
  }

        }

      html += "</div>";
      if (arr(ev.guarantees).length) {
        html += '<div style="margin-top:14px;border-top:1px solid #f0efea;padding-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">';
        arr(ev.guarantees).forEach(function (g) {
          html += '<div class="stat"><div class="k"><span>' + E(g.k) + '</span></div><div class="v" style="font-size:12.5px">' + E(g.v) + "</div></div>";

      }
      html += "</section>";

    if (!html) html = '<section class="card"><div class="card-sub">Nenhum evento/fila detectado no scan.</div></section>';

  /* ----- score ----- */
  function rScore() {
    var q = MODEL.quality || {};
    var sc = MODEL.score || {};
    var cov = arr((MODEL.history || {}).coverage);
    var prev = cov.length > 1 ? cov[cov.length - 2].v : null;
    var delta = prev != null && sc.overall != null ? sc.overall - prev : null;
    var gradeColor = sc.overall >= 90 ? "#3f7a4f" : sc.overall >= 75 ? "#2b8a92" : sc.overall >= 60 ? "#c08a2e" : "#b4453a";
    var html = "";
    html += '<section class="card"><div class="score-hero">';
    html += '<div><div class="kv-label">SCORE ATLAS</div><div style="display:flex;align-items:center;gap:14px;margin-top:6px">';
    html += '<div class="score-big" style="color:' + gradeColor + '">' + E(sc.overall != null ? sc.overall : "—") + "</div>";
    if (sc.grade) html += '<div class="score-grade" style="background:' + gradeColor + '">' + E(sc.grade) + "</div>";
    if (delta != null) html += '<div class="mono" style="font-size:12px;color:' + (delta >= 0 ? "#3f7a4f" : "#b4453a") + '">' + (delta >= 0 ? "+" : "") + delta + " vs scan anterior</div>";
    html += "</div></div>";
    html += '<div style="flex:1 1 300px;min-width:0"><div style="font-size:12.5px;color:#5d6470;line-height:1.6;max-width:60ch">Apuração determinística por script (atlas_build.py): cobertura dos fluxos, completude do modelo e quality gates. Gates ausentes ficam como lacuna visível e não derrubam a nota.</div></div>';
    html += "</div>";
    if (arr(sc.breakdown).length) {
      html += '<div class="grid-auto" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">';
      arr(sc.breakdown).forEach(function (b) {
        var ext = b.prov === "external";
        html += '<div class="stat' + (ext ? " dashed" : "") + '"><div class="k"><span>' + E(b.k) + "</span>" + provBadge(b.prov) + "</div>";
        html += '<div class="v">' + E(b.v != null ? b.v : "—") + '<span style="font-size:11px;color:#8a857d;font-weight:400"> · peso ' + E(b.weight) + "</span></div></div>";
      });
      html += "</div>";
    }
    html += "</section>";

    if (arr(q.gates).length) {
      html += '<section class="card"><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:14px"><div><div class="card-title">Quality Gateway</div><div class="card-sub">Resultado declarado no CI e em packs de auditoria</div></div></div>';
      html += '<div class="scroll-x"><div style="min-width:540px">';
      html += '<div class="tbl-hd" style="display:grid;grid-template-columns:minmax(150px,.8fr) 76px minmax(180px,1.2fr) minmax(150px,1fr)"><div>GATE</div><div>STATUS</div><div>DETALHE</div><div>FONTE</div></div>';
      arr(q.gates).forEach(function (g) {
        html += '<div class="tbl" style="grid-template-columns:minmax(150px,.8fr) 76px minmax(180px,1.2fr) minmax(150px,1fr)">';
        html += '<div style="font-size:12.5px;font-weight:500">' + E(g.name) + "</div>";
        html += '<div><span class="tag ' + (g.status === "pass" ? "green" : g.status === "warn" ? "amber" : g.status === "fail" ? "red" : "gray") + '">' + E(String(g.status || "").toUpperCase()) + "</span></div>";
        html += '<div style="font-size:12px;color:#5d6470">' + E(g.detail || "") + "</div>";
        html += '<div class="mono" style="font-size:10px;color:#8a857d">' + E(g.source || "—") + "</div></div>";
      });
      html += "</div></div></section>";
    } else {
      html += '<section class="card" style="border-style:dashed"><div class="card-title">Quality Gateway</div><div class="card-sub">Nenhum gate conectado. CI, cobertura de testes e packs de auditoria (ex.: ultra-deep-audit) alimentam esta seção quando existem no repo.</div></section>';
    }

    if (q.tests) {
      html += '<section class="card"><div class="card-title">Testes</div><div class="grid-auto" style="margin-top:12px">';
      html += '<div class="stat"><div class="k"><span>FRAMEWORK</span></div><div class="v" style="font-size:13px">' + E(q.tests.framework || "—") + "</div></div>";
      html += '<div class="stat"><div class="k"><span>COBERTURA</span>' + provBadge("code") + '</div><div class="v">' + E(q.tests.coveragePct != null ? q.tests.coveragePct + "%" : "—") + "</div></div>";
      html += '<div class="stat"><div class="k"><span>FONTE</span></div><div class="v" style="font-size:12px">' + E(q.tests.source || "—") + "</div></div></div></section>";
    }

    if (arr(q.findings).length) {
      var sevOrder = { "CRÍTICO": 0, CRITICO: 0, ALTO: 1, "MÉDIO": 2, MEDIO: 2, BAIXO: 3 };
      var sorted = arr(q.findings).slice().sort(function (a, b) { return (sevOrder[String(a.sev).toUpperCase()] || 9) - (sevOrder[String(b.sev).toUpperCase()] || 9); });
      html += '<section class="card"><div class="card-title" style="margin-bottom:12px">Findings importados</div><div class="rowline">';
      sorted.forEach(function (f) {
        html += '<div class="rowitem" style="grid-template-columns:86px minmax(0,1fr) minmax(120px,auto)">';
        html += '<div><span class="tag ' + sevTag(f.sev) + '">' + E(f.sev) + "</span></div>";
        html += '<div><div style="font-size:12.5px;font-weight:500">' + E(f.title) + '</div><div class="mono" style="font-size:10.5px;color:#a8a39a;margin-top:3px">' + E(f.where || "") + "</div></div>";
        html += '<div class="mono" style="font-size:10px;color:#8a857d;text-align:right">' + E(f.source || "") + "</div></div>";
      });
      html += "</div></section>";
    }

    if (cov.length) html += coverageCard(cov);
    return html;
  }

  function coverageCard(cov) {

  /* ----- inspector ----- */
  function panelClosedStrip() {

        html += '<button class="insp-tab' + (tab === t[0] ? " sel" : "") + '" onclick="A.tab(\'' + t[0] + '\')">' + t[1] + "</button>";
      });
      html += '<span class="insp-tab-hint">' + ({ payload: "exemplo derivado do código", contract: "fatos e erros mapeados", ddl: "migrações aplicadas", code: "links para o repositório" }[tab] || "") + "</span></div>";

          html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';

      arr(a.risks).forEach(function (r) { html += '<div class="dark-row"><span class="k">' + E(r.k || "Risco") + '</span><span class="v-risk">' + E(r.v) + "</span></div>"; });

  window.A = {
    go: function (k) { S.screen = k; setHash(); render(); },
    flow: function (id) { S.screen = "fluxos"; S.flow = id; S.step = 0; S.stepOpen = true; S.node = null; setHash(); render(); },
    selNode: function (id) { S.node = id; render(); },
    selStep: function (i) { if (S.step === i) S.stepOpen = !S.stepOpen; else { S.step = i; S.stepOpen = true; } render(); },
    tab: function (t) { S.tab = t; render(); },
    view: function (v) { S.view = v; render(); },
    panel: function () { S.panel = !S.panel; render(); },
    navT: function () { S.nav = !S.nav; render(); },
    envQ: function (v) {
      S.envQ = v;
      var el = document.getElementById("env-list");
      if (el) { el.outerHTML = '<div id="env-list" style="margin-top:10px">' + envList() + "</div>"; }
    },
    tgl: function (k) { S.acc[k] = !S.acc[k]; render(); }
  };

  /* ---------------- boot: hash router ---------------- */
  (function boot() {
    var h = (location.hash || "").replace(/^#\/?/, "");
    var parts = h.split("/");
    if (parts[0] && NAV.some(function (n) { return n.k === parts[0]; })) S.screen = parts[0];
    if (S.screen === "fluxos" && parts[1] && flowById(parts[1])) S.flow = parts[1];
    setHash();
    render();
  })();
})();
</script>
